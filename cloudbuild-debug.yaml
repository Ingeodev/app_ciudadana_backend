steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: "bash"
    args:
      - "-c"
      - |
        echo "=== Listando secretos ==="
        gcloud secrets list --project=app-ciudadana-cali-493402
        
        echo "=== Verificando db_secrets ==="
        gcloud secrets describe db_secrets --project=app-ciudadana-cali-493402
        
        echo "=== IAM bindings de db_secrets ==="
        gcloud secrets get-iam-policy db_secrets --project=app-ciudadana-cali-493402
        
        echo "=== Probando acceso a secreto ==="
        gcloud secrets versions access latest --secret=db_secrets --project=app-ciudadana-cali-493402 || echo "FALLO al acceder"
        
        echo "=== Verificando service account de Cloud Build ==="
        gcloud iam service-accounts describe 502836405953@cloudbuild.gserviceaccount.com --project=app-ciudadana-cali-493402